name: datphong-v2

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGODB_HOST_PORT:-27017}:27017"
    volumes:
      - datphong_v2_mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "127.0.0.1:27017", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo-init:
    image: mongo:8.0
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mongosh --quiet --host mongodb:27017 --eval '
          try {
            rs.status();
          } catch (error) {
            if (error.codeName === "NotYetInitialized") {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
            } else {
              throw error;
            }
          }
        '
        until mongosh --quiet --host mongodb:27017 --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; do sleep 2; done

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - datphong_v2_mysql:/var/lib/mysql
    environment:
      MYSQL_DATABASE: datphong
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: datphong-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - datphong_v2_public_storage:/var/www/html/storage/app/public
    environment:
      APP_NAME: ${APP_NAME:-DatPhong}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:ZGF0cGhvbmctbG9jYWwtZGV2ZWxvcG1lbnQta2V5ISE=}
      APP_DEBUG: ${APP_DEBUG:-true}
      PHP_CLI_SERVER_WORKERS: 8
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/oauth/google/callback}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-http://localhost:8000/api/v1/auth/oauth/facebook/callback}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: datphong
      DB_USERNAME: root
      DB_PASSWORD: ""
      MONGODB_DATABASE: ${MONGODB_DATABASE:-datphong}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/datphong?replicaSet=rs0}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      mysql:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  queue-worker:
    image: datphong-backend:local
    restart: unless-stopped
    entrypoint: []
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--timeout=90"]
    environment:
      APP_NAME: ${APP_NAME:-DatPhong}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:ZGF0cGhvbmctbG9jYWwtZGV2ZWxvcG1lbnQta2V5ISE=}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: datphong
      DB_USERNAME: root
      DB_PASSWORD: ""
      MONGODB_DATABASE: ${MONGODB_DATABASE:-datphong}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/datphong?replicaSet=rs0}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: datphong-backend:local
    restart: unless-stopped
    entrypoint: []
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_NAME: ${APP_NAME:-DatPhong}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:ZGF0cGhvbmctbG9jYWwtZGV2ZWxvcG1lbnQta2V5ISE=}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: datphong
      DB_USERNAME: root
      DB_PASSWORD: ""
      MONGODB_DATABASE: ${MONGODB_DATABASE:-datphong}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/datphong?replicaSet=rs0}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  outbox-publisher:
    image: datphong-backend:local
    restart: unless-stopped
    entrypoint: []
    command: ["php", "artisan", "outbox:publish", "--watch", "--sleep=1"]
    environment:
      APP_NAME: ${APP_NAME:-DatPhong}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:ZGF0cGhvbmctbG9jYWwtZGV2ZWxvcG1lbnQta2V5ISE=}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: datphong
      DB_USERNAME: root
      DB_PASSWORD: ""
      MONGODB_DATABASE: ${MONGODB_DATABASE:-datphong}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/datphong?replicaSet=rs0}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${REALTIME_PORT:-3001}:3001"
    environment:
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      REDIS_CHANNEL: staygo.events
      LARAVEL_AUTH_URL: http://backend:8000/api/v1/auth/me
      LARAVEL_CHAT_AUTH_URL: http://backend:8000/api/v1/chat/socket-auth
      AUTH_CACHE_TTL_MS: 15000
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3001}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  datphong_v2_mysql:
    name: datphong_v2_mysql
  datphong_v2_mongodb:
    name: datphong_v2_mongodb
  datphong_v2_public_storage:
    name: datphong_v2_public_storage
