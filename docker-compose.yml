name: datphong-v2

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-datphong}
      MYSQL_USER: ${MYSQL_USER:-datphong}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-datphong}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - datphong_v2_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: datphong-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-DatPhong}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:ZGF0cGhvbmctbG9jYWwtZGV2ZWxvcG1lbnQta2V5ISE=}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-datphong}
      DB_USERNAME: ${MYSQL_USER:-datphong}
      DB_PASSWORD: ${MYSQL_PASSWORD:-datphong}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  queue-worker:
    image: datphong-backend:local
    restart: unless-stopped
    entrypoint: []
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--timeout=90"]
    environment:
      APP_NAME: ${APP_NAME:-DatPhong}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:ZGF0cGhvbmctbG9jYWwtZGV2ZWxvcG1lbnQta2V5ISE=}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-datphong}
      DB_USERNAME: ${MYSQL_USER:-datphong}
      DB_PASSWORD: ${MYSQL_PASSWORD:-datphong}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  outbox-publisher:
    image: datphong-backend:local
    restart: unless-stopped
    entrypoint: []
    command: ["php", "artisan", "outbox:publish", "--watch", "--sleep=1"]
    environment:
      APP_NAME: ${APP_NAME:-DatPhong}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:ZGF0cGhvbmctbG9jYWwtZGV2ZWxvcG1lbnQta2V5ISE=}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-datphong}
      DB_USERNAME: ${MYSQL_USER:-datphong}
      DB_PASSWORD: ${MYSQL_PASSWORD:-datphong}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${REALTIME_PORT:-3001}:3001"
    environment:
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      REDIS_CHANNEL: staygo.events
      LARAVEL_AUTH_URL: http://backend:8000/api/v1/auth/me
      AUTH_CACHE_TTL_MS: 15000
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3001}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  datphong_v2_mysql:
    name: datphong_v2_mysql
